name: Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to keep the Render free tier active
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ALAT Sabi Health Check
        run: |
          echo "Pinging backend health endpoint..."
          curl -s -f -m 30 https://alat-sabi-api.onrender.com/health || echo "Ping request executed"
